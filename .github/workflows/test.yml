name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./...
      - name: Shell checks
        run: |
          sh -n install.sh
          ./install.sh --help >/dev/null
          bash -n .agents/skills/herdr-testing/scripts/herdr-tab
      - name: Docs links
        run: .agents/skills/documentation/scripts/check-docs
      - name: Linux static build
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 go build -o /dev/null .

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - name: Check SEO and assets
        working-directory: site
        run: npm run check
