name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check
        run: |
          go vet ./...
          go test ./...
      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          rm -rf dist package
          mkdir -p dist
          # macOS needs cgo for CoreAudio; Linux shells out to pw-dump/pactl
          # and is a static, cgo-free build.
          for TARGET in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            OS="${TARGET%/*}"
            ARCH="${TARGET#*/}"
            CGO=0
            [ "$OS" = darwin ] && CGO=1
            rm -rf package
            mkdir package
            CGO_ENABLED="$CGO" GOOS="$OS" GOARCH="$ARCH" go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o package/lofi-hiphopper .
            cp README.md install.sh package/
            (cd package && tar -czf "../dist/lofi-hiphopper_${OS}_${ARCH}.tar.gz" lofi-hiphopper README.md install.sh)
            file package/lofi-hiphopper || true
          done
          cp install.sh dist/install.sh
          (cd dist && shasum -a 256 lofi-hiphopper_*.tar.gz install.sh > checksums.txt)
          cat dist/checksums.txt
      - name: Verify installer (macOS)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$TAG" BASE_URL="file://$PWD/dist" INSTALL_DIR="$RUNNER_TEMP/lofi-install" ./install.sh
          "$RUNNER_TEMP/lofi-install/lofi-hiphopper" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  verify-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify installer (Linux)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$TAG" BASE_URL="file://$PWD/dist" INSTALL_DIR="$RUNNER_TEMP/lofi-install" sh ./install.sh
          "$RUNNER_TEMP/lofi-install/lofi-hiphopper" --version

  publish:
    needs: [build, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ github.token }}
